{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
# The application makes no AWS API calls, so this service account carries no
# IRSA annotation. Add eks.amazonaws.com/role-arn here if that changes —
# never grant AWS permissions via the node role, which would give them to
# every pod on the node.
automountServiceAccountToken: false
{{- end }}
