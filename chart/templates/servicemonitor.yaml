{{- if .Values.serviceMonitor.enabled }}
# Tells kube-prometheus-stack to scrape /actuator/prometheus.
#
# This is the link that makes canary analysis possible: no ServiceMonitor,
# no metrics in Prometheus, and every AnalysisRun errors with "no datapoints"
# which Argo Rollouts treats as inconclusive, and the rollout stalls.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    # kube-prometheus-stack's default serviceMonitorSelector matches on
    # release; monitoring-values.yaml also disables that selector so any
    # namespace can be scraped.
    release: monitoring
spec:
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      # Relabelling so the AnalysisTemplate queries can filter by
      # kubernetes_namespace and service.
      #
      # `action: replace` MUST be written explicitly even though it is the
      # default. The Prometheus Operator CRD schema defaults the field
      # server-side, so an omitted `action` comes back as `action: replace`
      # on the live object. ArgoCD then diffs Git (no action) against the
      # cluster (action: replace) and reports the ServiceMonitor OutOfSync
      # forever, because the two can never converge. Writing the default
      # explicitly makes Git match what the API server actually stores.
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - action: replace
          sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}
