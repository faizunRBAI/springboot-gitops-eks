version: 1
name: springboot-gitops-eks
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and verify formatting
        working-directory: app
        run: mvn -B -ntp clean compile

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        working-directory: app
        run: mvn -B -ntp test
      - name: Publish test summary
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          find app/target/surefire-reports -name '*.txt' -exec cat {} + >> "$GITHUB_STEP_SUMMARY" || true

  # PROVISION RUNS BEFORE BUILD_PUSH.
  # Terraform creates the ECR repository that build_push pushes to.
  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Read the ECR repository URL from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
      - name: Package application
        working-directory: app
        run: mvn -B -ntp clean package -DskipTests
      - name: Derive image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build image
        working-directory: app
        run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
      - name: Show accepted vulnerability exceptions
        run: |
          set -euo pipefail
          echo "### Accepted vulnerability exceptions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^\s*#' app/.trivyignore | grep -v '^\s*$' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat app/.trivyignore
      # Sole pre-push vulnerability gate. exit-code 1 means a HIGH/CRITICAL
      # finding fails the build before the image reaches ECR.
      # DO NOT add a `version:` input (breaks the installer's write path) and
      # do not pin the action to a numeric tag (pre-flight resolution fails).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/app:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: app/.trivyignore
      # Authentication uses the platform's injected static credentials. OIDC
      # needs `permissions: id-token: write`, which the pipeline spec cannot
      # express — see the header of infra/oidc.tf for the restore procedure.
      - name: Confirm the AWS identity in use
        run: |
          set -euo pipefail
          echo "Authenticated as:"
          aws sts get-caller-identity
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push image to ECR
        env:
          ECR_URL: ${{ steps.tf.outputs.ecr_url }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.image_tag }}"
          docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"
          docker push "${ECR_URL}:${TAG}"
          echo "Pushed ${TAG} to ECR."

  - id: configure
    kind: configure
    needs: [provision, build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Read infrastructure outputs from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "lbc_role_arn=$(terraform output -raw lbc_role_arn)" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      # vpcId IS MANDATORY HERE.
      # Without it the controller discovers its VPC by calling EC2 IMDS from
      # inside the pod. EKS nodes default to IMDSv2 with a hop limit of 1, and
      # a pod-originated call takes one hop too many, so IMDS never answers:
      #   "unable to initialize AWS cloud", "failed to get VPC ID: ...
      #    ec2imds: GetMetadata, canceled, context deadline exceeded"
      # The pods then CrashLoopBackOff and helm --wait reports only the
      # unhelpful "Error: context deadline exceeded".
      # Passing the VPC ID explicitly avoids IMDS entirely. Do NOT instead
      # raise the node hop limit to 2 — that exposes the node's instance
      # credentials to every pod on the host.
      - name: Install AWS Load Balancer Controller
        run: |
          set -euo pipefail
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          kubectl create serviceaccount aws-load-balancer-controller -n kube-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl annotate serviceaccount aws-load-balancer-controller -n kube-system \
            eks.amazonaws.com/role-arn="${{ steps.tf.outputs.lbc_role_arn }}" --overwrite
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 1.10.1 --namespace kube-system \
            --set clusterName="${{ steps.tf.outputs.cluster_name }}" \
            --set region=us-east-1 \
            --set vpcId="${{ steps.tf.outputs.vpc_id }}" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --wait --timeout 15m
      - name: Show controller state if it did not settle
        run: |
          set -euo pipefail
          kubectl -n kube-system get pods -l app.kubernetes.io/name=aws-load-balancer-controller -o wide
      - name: Install Argo Rollouts controller
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argo-rollouts argo/argo-rollouts \
            --version 2.38.2 --namespace argo-rollouts --create-namespace \
            --wait --timeout 15m
      - name: Install kube-prometheus-stack
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 66.3.1 --namespace monitoring --create-namespace \
            --values gitops/values/monitoring-values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait --timeout 20m
      - name: Install ArgoCD
        run: |
          set -euo pipefail
          helm upgrade --install argocd argo/argo-cd \
            --version 7.7.11 --namespace argocd --create-namespace \
            --values gitops/values/argocd-values.yaml \
            --wait --timeout 15m
      - name: Point the GitOps values at the real ECR repository and image tag
        working-directory: infra
        run: |
          set -euo pipefail
          ECR_URL="$(terraform output -raw ecr_repository_url)"
          cd ..
          TAG="${GITHUB_SHA::12}"
          python3 - "$ECR_URL" "$TAG" <<'PY'
          import sys, pathlib, re
          ecr, tag = sys.argv[1], sys.argv[2]
          p = pathlib.Path("gitops/application-values.yaml")
          text = p.read_text()
          text = text.replace("PLACEHOLDER_ECR_REPOSITORY", ecr)
          text = text.replace("PLACEHOLDER_IMAGE_TAG", tag)
          text = re.sub(r'(?m)^(\s*repository:\s*).*$', lambda m: m.group(1) + ecr, text, count=1)
          text = re.sub(r'(?m)^(\s*tag:\s*).*$', lambda m: m.group(1) + tag, text, count=1)
          p.write_text(text)
          print(f"gitops values -> {ecr}:{tag}")
          PY
      - name: Commit the GitOps values if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gitops/application-values.yaml; then
            echo "GitOps values already current; nothing to commit."
          else
            git add gitops/application-values.yaml
            # [skip ci] is loop-prevention layer 1.
            git commit -m "chore(gitops): pin image tag ${GITHUB_SHA::12} [skip ci]"
            git push origin HEAD:main
          fi
      # No ArgoCD repository credential: the monorepo is PUBLIC and ArgoCD
      # clones it anonymously. A credential secret with an empty token would be
      # worse than none.
      - name: Apply the ArgoCD root application
        run: |
          set -euo pipefail
          sed "s|__REPO_URL__|https://github.com/${{ github.repository }}.git|g" \
            gitops/root-app.yaml | kubectl apply -f -

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read cluster name from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      - name: Show cluster nodes
        run: kubectl get nodes -o wide
      - name: Show platform components
        run: |
          set -euo pipefail
          echo "--- kube-system (load balancer controller) ---"
          kubectl -n kube-system get pods -l app.kubernetes.io/name=aws-load-balancer-controller --no-headers || true
          echo "--- argocd ---"
          kubectl -n argocd get pods --no-headers || true
          echo "--- argo-rollouts ---"
          kubectl -n argo-rollouts get pods --no-headers || true
          echo "--- monitoring ---"
          kubectl -n monitoring get pods --no-headers || true
      - name: Wait for ArgoCD to sync the application
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            SYNC=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)
            HEALTH=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.health.status}' 2>/dev/null || echo Unknown)
            echo "attempt ${i}: sync=${SYNC} health=${HEALTH}"
            case "${SYNC}/${HEALTH}" in
              Synced/Healthy)
                echo "ArgoCD reports the application Synced and Healthy."
                exit 0
                ;;
              Synced/Suspended)
                echo "Rollout is paused awaiting analysis or manual promotion; treating as reconciled."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "ArgoCD did not reconcile in time. Diagnostics follow:"
          kubectl -n argocd get application springboot-app -o yaml || true
          kubectl -n springboot-app get pods -o wide || true
          kubectl -n springboot-app get events --sort-by=.lastTimestamp || true
          exit 1
      - name: Show rollout status
        run: kubectl -n springboot-app get rollout springboot-app -o wide || true
      - name: Probe the application through the load balancer
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            HOST=$(kubectl -n springboot-app get ingress springboot-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${HOST}" ]; then
              if curl --fail --silent --show-error --max-time 10 "http://${HOST}/actuator/health"; then
                echo ""
                echo "Application healthy at http://${HOST}"
                {
                  echo "### Application is live"
                  echo ""
                  echo "http://${HOST}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "attempt ${i}: load balancer not serving yet"
            sleep 20
          done
          echo "Application never became reachable. Diagnostics follow:"
          kubectl -n springboot-app describe ingress springboot-app || true
          kubectl -n springboot-app get pods -o wide || true
          exit 1

pipelines:
  # ---------------------------------------------------------------------
  # Continuous application delivery. Runs on APPLICATION changes only.
  # Never touches the cluster: builds, scans, pushes to ECR and bumps the
  # image tag in gitops/. ArgoCD does the deploying.
  # ---------------------------------------------------------------------
  - id: app-delivery
    stages:
      - id: app_test
        kind: test
        needs: []
        timeout_minutes: 25
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Run unit tests
            working-directory: app
            run: mvn -B -ntp test

      - id: app_release
        kind: build_push
        needs: [app_test]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_region: us-east-1
          TF_VAR_github_repo: ${{ github.repository }}
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Read the ECR repository URL from terraform state
            id: tf
            working-directory: infra
            run: |
              set -euo pipefail
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          - name: Package application
            working-directory: app
            run: mvn -B -ntp clean package -DskipTests
          - name: Derive image tag
            id: meta
            run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          - name: Build image
            working-directory: app
            run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
          - name: Scan image with Trivy
            uses: aquasecurity/trivy-action@master
            with:
              image-ref: local/app:${{ steps.meta.outputs.image_tag }}
              format: table
              exit-code: "1"
              severity: HIGH,CRITICAL
              ignore-unfixed: "true"
              trivyignores: app/.trivyignore
          - name: Confirm the AWS identity in use
            run: |
              set -euo pipefail
              echo "Authenticated as:"
              aws sts get-caller-identity
          - name: Log in to ECR
            id: ecr
            uses: aws-actions/amazon-ecr-login@v2
          - name: Push image to ECR
            env:
              ECR_URL: ${{ steps.tf.outputs.ecr_url }}
            run: |
              set -euo pipefail
              TAG="${{ steps.meta.outputs.image_tag }}"
              docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"
              docker push "${ECR_URL}:${TAG}"
          - name: Bump the image tag in the GitOps values
            run: |
              set -euo pipefail
              TAG="${{ steps.meta.outputs.image_tag }}"
              python3 - "$TAG" <<'PY'
              import sys, pathlib, re
              tag = sys.argv[1]
              p = pathlib.Path("gitops/application-values.yaml")
              text = p.read_text()
              new, n = re.subn(r'(?m)^(\s*tag:\s*).*$', lambda m: m.group(1) + tag, text, count=1)
              if n != 1:
                  raise SystemExit("expected exactly one 'tag:' line in gitops/application-values.yaml")
              p.write_text(new)
              print(f"pinned image tag {tag}")
              PY
          - name: Commit and push the tag bump
            run: |
              set -euo pipefail
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              if git diff --quiet -- gitops/application-values.yaml; then
                echo "Image tag unchanged; nothing to commit."
              else
                git add gitops/application-values.yaml
                # [skip ci] stops this commit from starting another run.
                git commit -m "chore(gitops): deploy ${{ steps.meta.outputs.image_tag }} [skip ci]"
                git push origin HEAD:main
                echo "ArgoCD will reconcile this commit onto the cluster."
              fi

rollback:
  strategy: rerun
