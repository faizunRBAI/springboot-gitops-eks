version: 1
name: springboot-gitops-eks
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and verify formatting
        working-directory: app
        run: mvn -B -ntp clean compile

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        working-directory: app
        run: mvn -B -ntp test
      - name: Publish test summary
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          find app/target/surefire-reports -name '*.txt' -exec cat {} + >> "$GITHUB_STEP_SUMMARY" || true

  # PROVISION RUNS BEFORE BUILD_PUSH.
  # Terraform creates the ECR repository AND the GitHub OIDC role that
  # build_push authenticates with. Building first would mean pushing to a
  # registry that does not exist yet, using a role that has not been created.
  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
      - name: Report the CI role ARN for the AWS_CI_ROLE_ARN secret
        working-directory: infra
        run: |
          set -euo pipefail
          {
            echo "### Infrastructure ready"
            echo ""
            echo "If this is the first deploy, set the AWS_CI_ROLE_ARN"
            echo "repository secret to the value below and run deploy again."
            echo ""
            echo '```'
            terraform output -raw ci_role_arn
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ci_role_arn recorded in the job summary."

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      # Read the ECR URL from state rather than reconstructing it from a name
      # pattern. This job is self-sufficient: it does not consume job outputs
      # from provision, which GitHub would drop because they embed PROJECT_NAME.
      - name: Read the ECR repository URL from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
      - name: Package application
        working-directory: app
        run: mvn -B -ntp clean package -DskipTests
      - name: Derive image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build image
        working-directory: app
        run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
      # Show what the accepted exceptions are, in the run log, every run.
      # A suppression nobody sees is a suppression nobody reviews.
      - name: Show accepted vulnerability exceptions
        run: |
          set -euo pipefail
          echo "### Accepted vulnerability exceptions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^\s*#' app/.trivyignore | grep -v '^\s*$' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "See app/.trivyignore for the justification and review date."
          cat app/.trivyignore
      # Sole pre-push vulnerability gate. Scans OS packages AND the Spring Boot
      # JARs inside the image, so Java CVEs are caught at the deployed artifact.
      # exit-code 1: a HIGH/CRITICAL finding fails the build before any push.
      #
      # trivyignores points at app/.trivyignore explicitly: this step runs from
      # the repository ROOT, so Trivy would not find a file living under app/.
      # That file suppresses THREE named CVE IDs only; the severity threshold
      # is untouched and every other HIGH/CRITICAL still fails the build.
      #
      # DO NOT ADD a `version:` input here. Pinning the scanner version makes
      # the action take an install path that writes the binary to
      # $HOME/.local/bin/trivy-bin WITHOUT creating that directory, and the
      # installer exits 1 immediately after reporting "found version". The
      # default path works. Likewise do not pin the action to a numeric tag:
      # a nonexistent tag fails GitHub's pre-flight resolution and the job
      # never starts.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/app:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: app/.trivyignore
      - name: Verify the OIDC role secret is present
        env:
          CI_ROLE_ARN: ${{ secrets.AWS_CI_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${CI_ROLE_ARN}" ]; then
            echo "AWS_CI_ROLE_ARN is not set."
            echo ""
            echo "It is created by the provision stage (terraform output"
            echo "ci_role_arn). Set it as a repository secret and run again."
            exit 1
          fi
          echo "AWS_CI_ROLE_ARN is configured."
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push image to ECR
        env:
          ECR_URL: ${{ steps.tf.outputs.ecr_url }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.image_tag }}"
          docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"
          docker push "${ECR_URL}:${TAG}"
          echo "Pushed ${TAG} to ECR."

  - id: configure
    kind: configure
    needs: [provision, build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Read infrastructure outputs from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "lbc_role_arn=$(terraform output -raw lbc_role_arn)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      - name: Install AWS Load Balancer Controller
        run: |
          set -euo pipefail
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          kubectl create serviceaccount aws-load-balancer-controller -n kube-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl annotate serviceaccount aws-load-balancer-controller -n kube-system \
            eks.amazonaws.com/role-arn="${{ steps.tf.outputs.lbc_role_arn }}" --overwrite
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 1.10.1 --namespace kube-system \
            --set clusterName="${{ steps.tf.outputs.cluster_name }}" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=us-east-1 \
            --wait --timeout 10m
      - name: Install Argo Rollouts controller
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argo-rollouts argo/argo-rollouts \
            --version 2.38.2 --namespace argo-rollouts --create-namespace \
            --wait --timeout 10m
      - name: Install kube-prometheus-stack
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 66.3.1 --namespace monitoring --create-namespace \
            --values gitops/values/monitoring-values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait --timeout 15m
      - name: Install ArgoCD
        run: |
          set -euo pipefail
          helm upgrade --install argocd argo/argo-cd \
            --version 7.7.11 --namespace argocd --create-namespace \
            --values gitops/values/argocd-values.yaml \
            --wait --timeout 15m
      - name: Point the GitOps values at the real ECR repository and image tag
        working-directory: infra
        run: |
          set -euo pipefail
          ECR_URL="$(terraform output -raw ecr_repository_url)"
          cd ..
          TAG="${GITHUB_SHA::12}"
          python3 - "$ECR_URL" "$TAG" <<'PY'
          import sys, pathlib, re
          ecr, tag = sys.argv[1], sys.argv[2]
          p = pathlib.Path("gitops/application-values.yaml")
          text = p.read_text()
          text = text.replace("PLACEHOLDER_ECR_REPOSITORY", ecr)
          text = text.replace("PLACEHOLDER_IMAGE_TAG", tag)
          text = re.sub(r'(?m)^(\s*repository:\s*).*$', lambda m: m.group(1) + ecr, text, count=1)
          text = re.sub(r'(?m)^(\s*tag:\s*).*$', lambda m: m.group(1) + tag, text, count=1)
          p.write_text(text)
          print(f"gitops values -> {ecr}:{tag}")
          PY
      - name: Commit the GitOps values if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gitops/application-values.yaml; then
            echo "GitOps values already current; nothing to commit."
          else
            git add gitops/application-values.yaml
            # [skip ci] is loop-prevention layer 1: this commit must never
            # start another delivery run.
            git commit -m "chore(gitops): pin image tag ${GITHUB_SHA::12} [skip ci]"
            git push origin HEAD:main
          fi
      # NOTE: no ArgoCD repository credential is registered. The monorepo is
      # PUBLIC, so ArgoCD clones it anonymously. Creating a credential secret
      # with an empty token would be worse than none: ArgoCD would attempt
      # authenticated clones and fail.
      - name: Apply the ArgoCD root application
        run: |
          set -euo pipefail
          sed "s|__REPO_URL__|https://github.com/${{ github.repository }}.git|g" \
            gitops/root-app.yaml | kubectl apply -f -

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read cluster name from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      - name: Show cluster nodes
        run: kubectl get nodes -o wide
      - name: Show platform components
        run: |
          set -euo pipefail
          echo "--- argocd ---"
          kubectl -n argocd get pods --no-headers || true
          echo "--- argo-rollouts ---"
          kubectl -n argo-rollouts get pods --no-headers || true
          echo "--- monitoring ---"
          kubectl -n monitoring get pods --no-headers || true
      - name: Wait for ArgoCD to sync the application
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            SYNC=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)
            HEALTH=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.health.status}' 2>/dev/null || echo Unknown)
            echo "attempt ${i}: sync=${SYNC} health=${HEALTH}"
            case "${SYNC}/${HEALTH}" in
              Synced/Healthy)
                echo "ArgoCD reports the application Synced and Healthy."
                exit 0
                ;;
              Synced/Suspended)
                echo "Rollout is paused awaiting analysis or manual promotion; treating as reconciled."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "ArgoCD did not reconcile in time. Diagnostics follow:"
          kubectl -n argocd get application springboot-app -o yaml || true
          kubectl -n springboot-app get pods -o wide || true
          kubectl -n springboot-app get events --sort-by=.lastTimestamp || true
          exit 1
      - name: Show rollout status
        run: kubectl -n springboot-app get rollout springboot-app -o wide || true
      - name: Probe the application through the load balancer
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            HOST=$(kubectl -n springboot-app get ingress springboot-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${HOST}" ]; then
              if curl --fail --silent --show-error --max-time 10 "http://${HOST}/actuator/health"; then
                echo ""
                echo "Application healthy at http://${HOST}"
                {
                  echo "### Application is live"
                  echo ""
                  echo "http://${HOST}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "attempt ${i}: load balancer not serving yet"
            sleep 20
          done
          echo "Application never became reachable. Diagnostics follow:"
          kubectl -n springboot-app describe ingress springboot-app || true
          kubectl -n springboot-app get pods -o wide || true
          exit 1

pipelines:
  # ---------------------------------------------------------------------
  # Continuous application delivery.
  #
  # Runs on APPLICATION changes only, once the infrastructure exists. It
  # never touches the cluster: it builds, scans, pushes to ECR and bumps the
  # image tag in gitops/. ArgoCD does the deploying.
  # ---------------------------------------------------------------------
  - id: app-delivery
    stages:
      - id: app_test
        kind: test
        needs: []
        timeout_minutes: 25
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Run unit tests
            working-directory: app
            run: mvn -B -ntp test

      - id: app_release
        kind: build_push
        needs: [app_test]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_region: us-east-1
          TF_VAR_github_repo: ${{ github.repository }}
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Read the ECR repository URL from terraform state
            id: tf
            working-directory: infra
            run: |
              set -euo pipefail
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          - name: Package application
            working-directory: app
            run: mvn -B -ntp clean package -DskipTests
          - name: Derive image tag
            id: meta
            run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          - name: Build image
            working-directory: app
            run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
          # Same contract as the deploy pipeline: @master, NO `version:` input,
          # and trivyignores pointed at app/.trivyignore because this step runs
          # from the repository root.
          - name: Scan image with Trivy
            uses: aquasecurity/trivy-action@master
            with:
              image-ref: local/app:${{ steps.meta.outputs.image_tag }}
              format: table
              exit-code: "1"
              severity: HIGH,CRITICAL
              ignore-unfixed: "true"
              trivyignores: app/.trivyignore
          - name: Authenticate to AWS via OIDC
            uses: aws-actions/configure-aws-credentials@v4
            with:
              role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
              aws-region: us-east-1
          - name: Log in to ECR
            id: ecr
            uses: aws-actions/amazon-ecr-login@v2
          - name: Push image to ECR
            env:
              ECR_URL: ${{ steps.tf.outputs.ecr_url }}
            run: |
              set -euo pipefail
              TAG="${{ steps.meta.outputs.image_tag }}"
              docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"
              docker push "${ECR_URL}:${TAG}"
          - name: Bump the image tag in the GitOps values
            run: |
              set -euo pipefail
              TAG="${{ steps.meta.outputs.image_tag }}"
              python3 - "$TAG" <<'PY'
              import sys, pathlib, re
              tag = sys.argv[1]
              p = pathlib.Path("gitops/application-values.yaml")
              text = p.read_text()
              new, n = re.subn(r'(?m)^(\s*tag:\s*).*$', lambda m: m.group(1) + tag, text, count=1)
              if n != 1:
                  raise SystemExit("expected exactly one 'tag:' line in gitops/application-values.yaml")
              p.write_text(new)
              print(f"pinned image tag {tag}")
              PY
          - name: Commit and push the tag bump
            run: |
              set -euo pipefail
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              if git diff --quiet -- gitops/application-values.yaml; then
                echo "Image tag unchanged; nothing to commit."
              else
                git add gitops/application-values.yaml
                # [skip ci] stops this commit from starting another run.
                git commit -m "chore(gitops): deploy ${{ steps.meta.outputs.image_tag }} [skip ci]"
                git push origin HEAD:main
                echo "ArgoCD will reconcile this commit onto the cluster."
              fi

rollback:
  strategy: rerun
