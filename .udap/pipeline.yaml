version: 1
name: springboot-gitops-eks
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and verify formatting
        working-directory: app
        run: mvn -B -ntp clean compile

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        working-directory: app
        run: mvn -B -ntp test
      - name: Publish test summary
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          find app/target/surefire-reports -name '*.txt' -exec cat {} + >> "$GITHUB_STEP_SUMMARY" || true

  # PROVISION RUNS BEFORE BUILD_PUSH.
  # Terraform creates the ECR repository that build_push pushes to.
  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Read the ECR repository URL from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
      - name: Package application
        working-directory: app
        run: mvn -B -ntp clean package -DskipTests
      - name: Derive image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build image
        working-directory: app
        run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
      - name: Show accepted vulnerability exceptions
        run: |
          echo "### Accepted vulnerability exceptions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^\s*#' app/.trivyignore | grep -v '^\s*$' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat app/.trivyignore
      # Sole pre-push vulnerability gate. exit-code 1 means a HIGH/CRITICAL
      # finding fails the build before the image reaches ECR.
      # DO NOT add a `version:` input (breaks the installer's write path) and
      # do not pin the action to a numeric tag (pre-flight resolution fails).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/app:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: app/.trivyignore
      # Authentication uses the platform's injected static credentials. OIDC
      # needs `permissions: id-token: write`, which the pipeline spec cannot
      # express — see the header of infra/oidc.tf.
      - name: Confirm the AWS identity in use
        run: |
          set -euo pipefail
          aws sts get-caller-identity
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push image to ECR
        env:
          ECR_URL: ${{ steps.tf.outputs.ecr_url }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.image_tag }}"
          docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"
          docker push "${ECR_URL}:${TAG}"
          echo "Pushed ${TAG} to ECR."
      - name: Record the image reference for the GitOps values
        env:
          ECR_URL: ${{ steps.tf.outputs.ecr_url }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.image_tag }}"
          {
            echo "### Image published"
            echo ""
            echo "If gitops/application-values.yaml does not already point at"
            echo "this tag, update it and commit through the platform:"
            echo ""
            echo '```yaml'
            echo "image:"
            echo "  repository: ${ECR_URL}"
            echo "  tag: ${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # CONFIGURE installs the cluster platform ONLY.
  - id: configure
    kind: configure
    needs: [provision, build_push]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Read infrastructure outputs from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "lbc_role_arn=$(terraform output -raw lbc_role_arn)" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      # vpcId IS MANDATORY. Without it the controller discovers its VPC via EC2
      # IMDS from inside the pod; EKS nodes default to an IMDSv2 hop limit of 1
      # and a pod-originated call takes one hop too many, so IMDS never answers
      # and the pods CrashLoopBackOff. Do NOT raise the node hop limit to 2 —
      # that exposes node instance credentials to every pod on the host.
      - name: Install AWS Load Balancer Controller
        timeout-minutes: 12
        run: |
          set -euo pipefail
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          kubectl create serviceaccount aws-load-balancer-controller -n kube-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl annotate serviceaccount aws-load-balancer-controller -n kube-system \
            eks.amazonaws.com/role-arn="${{ steps.tf.outputs.lbc_role_arn }}" --overwrite
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 1.10.1 --namespace kube-system \
            --set clusterName="${{ steps.tf.outputs.cluster_name }}" \
            --set region=us-east-1 \
            --set vpcId="${{ steps.tf.outputs.vpc_id }}" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller
          kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=8m
      - name: Install Argo Rollouts controller
        timeout-minutes: 12
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argo-rollouts argo/argo-rollouts \
            --version 2.38.2 --namespace argo-rollouts --create-namespace
          kubectl -n argo-rollouts rollout status deployment/argo-rollouts --timeout=8m
      - name: Install kube-prometheus-stack
        timeout-minutes: 20
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 66.3.1 --namespace monitoring --create-namespace \
            --values gitops/values/monitoring-values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          kubectl -n monitoring rollout status statefulset/prometheus-monitoring-kube-prometheus-prometheus --timeout=15m
      # The ArgoCD UI is published on a public ALB, so the admin credential is a
      # ROTATED secret rather than the chart's never-rotated bootstrap value in
      # argocd-initial-admin-secret.
      #
      # The chart wants a BCRYPT HASH here, not plaintext — plaintext produces a
      # login that can never succeed. htpasswd (apache2-utils, preinstalled on
      # ubuntu-latest) generates it with -B (bcrypt) and -i (read the secret
      # from STDIN, so it never appears as a process argument). Only the
      # plaintext lives in the secret store; no hash is committed to Git.
      - name: Install ArgoCD
        timeout-minutes: 15
        env:
          ADMIN_SECRET: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          HASH=$(printf '%s' "${ADMIN_SECRET}" | htpasswd -niBC 10 admin | cut -d: -f2)
          if [ -z "${HASH}" ]; then
            echo "ERROR: could not derive the ArgoCD admin credential hash."
            exit 1
          fi
          helm upgrade --install argocd argo/argo-cd \
            --version 7.7.11 --namespace argocd --create-namespace \
            --values gitops/values/argocd-values.yaml \
            --set-string configs.secret.argocdServerAdminPassword="${HASH}"
          kubectl -n argocd rollout status deployment/argocd-server --timeout=10m
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=10m
      # The bootstrap credential is superseded by the rotated one above. Leaving
      # it in the cluster means a second valid-looking secret that no longer
      # matches the live login, which misleads whoever reads it next.
      - name: Remove the superseded bootstrap admin secret
        run: |
          kubectl -n argocd delete secret argocd-initial-admin-secret --ignore-not-found=true || true
      # Reporting only — must never be able to fail the build. No pipefail, no
      # grep: `grep -v Running` exits 1 when every pod IS Running, which once
      # failed this stage precisely because the cluster was healthy.
      - name: Report platform state
        run: |
          helm list --all-namespaces || true
          echo "--- pods ---"
          kubectl get pods -A || true

  # ---------------------------------------------------------------------
  # GITOPS HANDOFF — creates the ArgoCD Application. CI stops here.
  #
  # THIS STAGE DOES NOT PUSH TO GIT, and must not.
  # GITHUB_TOKEN is granted `contents: read` in rendered workflows, and the
  # pipeline spec has no `permissions` key to raise it, so a push fails with:
  #   remote: Permission to <repo>.git denied to github-actions[bot].
  #   fatal: ... The requested URL returned error: 403
  # The commit succeeds locally and the push dies, which is why the repository
  # never showed the [skip ci] commit while the job appeared to do its work.
  #
  # Instead, gitops/application-values.yaml is maintained in the repository
  # itself (updated and committed through the platform's own commit flow, which
  # is the sanctioned way to change the repo anyway). This stage VERIFIES those
  # values are real and then applies the Application.
  #
  # Consequence for day-2: the app-delivery pipeline cannot auto-bump the image
  # tag either. A new image is published, and the tag is promoted by committing
  # gitops/application-values.yaml. That is still GitOps — the deployed version
  # is whatever Git says — it simply is not automatic. Documented in the README.
  # ---------------------------------------------------------------------
  - id: gitops_handoff
    kind: custom
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read the cluster name from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      # Fail loudly if the committed values are not deployable, rather than
      # creating an Application that ArgoCD cannot render.
      - name: Verify the GitOps values are real
        run: |
          set -euo pipefail
          echo "--- gitops/application-values.yaml (image block) ---"
          sed -n '/^image:/,/^replicaCount/p' gitops/application-values.yaml
          if grep -q 'PLACEHOLDER' gitops/application-values.yaml; then
            echo ""
            echo "ERROR: gitops/application-values.yaml still contains a PLACEHOLDER."
            echo "ArgoCD cannot render the chart from placeholder values."
            echo "Update image.repository and image.tag in that file, commit it,"
            echo "and run the deploy again. The build_push job summary prints the"
            echo "exact values to use."
            exit 1
          fi
          echo "GitOps values are concrete."
      - name: Apply the ArgoCD root application
        run: |
          set -euo pipefail
          sed "s|__REPO_URL__|https://github.com/${{ github.repository }}.git|g" \
            gitops/root-app.yaml | kubectl apply -f -
      - name: Confirm the application exists
        run: |
          kubectl -n argocd get applications || true
          {
            echo "### GitOps handoff complete"
            echo ""
            echo "ArgoCD now owns the application. CI does not deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  - id: verify
    kind: verify
    needs: [provision, configure, gitops_handoff]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read cluster name from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region us-east-1
      - name: Show cluster state
        run: |
          kubectl get nodes -o wide || true
          echo "--- platform pods ---"
          kubectl get pods -n kube-system || true
          kubectl get pods -n argocd || true
          kubectl get pods -n argo-rollouts || true
          kubectl get pods -n monitoring || true
      # GATE ON HEALTH, NOT ON SYNC STATUS.
      #
      # This previously required sync=Synced AND health=Healthy, and timed out
      # after 12 minutes of "attempt N: sync=OutOfSync health=Healthy" on a
      # cluster that was serving traffic correctly the whole time.
      #
      # An ArgoCD Application can sit at OutOfSync indefinitely for reasons that
      # are not failures: controllers write defaulted or status fields that are
      # absent from Git, so the live object and the manifest never compare equal
      # even though every resource was applied exactly as declared. ArgoCD's own
      # operationState says "successfully synced (all tasks run)".
      #
      # health is the signal that answers "did the desired state actually take
      # effect", which is what this stage exists to assert. Sync status is
      # printed for visibility and a genuinely failed sync operation still fails
      # the stage, so a real reconciliation error is not masked.
      - name: Wait for ArgoCD to reconcile the application
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            SYNC=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)
            HEALTH=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.health.status}' 2>/dev/null || echo Unknown)
            PHASE=$(kubectl -n argocd get application springboot-app -o jsonpath='{.status.operationState.phase}' 2>/dev/null || echo "")
            echo "attempt ${i}: sync=${SYNC} health=${HEALTH} operation=${PHASE:-none}"

            # A sync operation that actually errored is a real failure.
            if [ "${PHASE}" = "Failed" ] || [ "${PHASE}" = "Error" ]; then
              echo "ArgoCD sync operation reported ${PHASE}."
              kubectl -n argocd get application springboot-app \
                -o jsonpath='{.status.operationState.message}' || true
              echo ""
              exit 1
            fi

            case "${HEALTH}" in
              Healthy)
                echo "ArgoCD reports the application Healthy (sync=${SYNC})."
                exit 0
                ;;
              Suspended)
                echo "Rollout is paused awaiting canary analysis or manual promotion."
                echo "The application is reconciled; treating as success."
                exit 0
                ;;
              Degraded)
                echo "ArgoCD reports the application Degraded. Diagnostics follow:"
                kubectl -n springboot-app get pods -o wide || true
                kubectl -n springboot-app describe rollout springboot-app || true
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "ArgoCD did not reach a healthy state in time. Diagnostics follow:"
          kubectl -n argocd get application springboot-app -o yaml || true
          kubectl -n springboot-app get pods -o wide || true
          kubectl -n springboot-app get events --sort-by=.lastTimestamp || true
          exit 1
      - name: Report reconciliation detail
        run: |
          echo "--- application resources ---"
          kubectl -n argocd get application springboot-app \
            -o jsonpath='{range .status.resources[*]}{.kind}/{.name} {.status}{"\n"}{end}' || true
          echo "--- rollout ---"
          kubectl -n springboot-app get rollout springboot-app -o wide || true
      - name: Probe the application through the load balancer
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            HOST=$(kubectl -n springboot-app get ingress springboot-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${HOST}" ]; then
              if curl --fail --silent --show-error --max-time 10 "http://${HOST}/actuator/health"; then
                echo ""
                echo "Application healthy at http://${HOST}"
                {
                  echo "### Application is live"
                  echo ""
                  echo "http://${HOST}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "attempt ${i}: load balancer not serving yet"
            sleep 20
          done
          echo "Application never became reachable. Diagnostics follow:"
          kubectl -n springboot-app describe ingress springboot-app || true
          kubectl -n springboot-app get pods -o wide || true
          exit 1
      # Probe the public ArgoCD console and report its address, so the exposure
      # is visible in the run summary rather than only in a values-file comment.
      # Reporting only: a slow ALB registration must not fail an otherwise good
      # deploy, so this never exits non-zero.
      - name: Report the ArgoCD console address
        timeout-minutes: 8
        run: |
          ARGOCD_HOST=""
          for i in $(seq 1 20); do
            ARGOCD_HOST=$(kubectl -n argocd get ingress argocd-server \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "${ARGOCD_HOST}" ]; then
              break
            fi
            echo "attempt ${i}: ArgoCD ingress address not assigned yet"
            sleep 15
          done
          {
            echo "### ArgoCD console — PUBLIC, HTTP, admin-credentialed"
            echo ""
            if [ -n "${ARGOCD_HOST}" ]; then
              echo "http://${ARGOCD_HOST}"
              echo ""
              if curl --fail --silent --show-error --max-time 10 \
                   "http://${ARGOCD_HOST}/healthz" >/dev/null 2>&1; then
                echo "Health check: serving."
              else
                echo "Health check: not answering yet (ALB target registration"
                echo "takes a few minutes after the ingress is created)."
              fi
            else
              echo "Ingress address not assigned yet."
            fi
            echo ""
            echo "Reachable from 0.0.0.0/0 with no TLS and no SSO. Demo only."
          } >> "$GITHUB_STEP_SUMMARY"

pipelines:
  # ---------------------------------------------------------------------
  # Continuous application delivery. Runs on APPLICATION changes only.
  #
  # It builds, scans and publishes the image, then PRINTS the reference to
  # promote. It does not commit: GITHUB_TOKEN has contents: read and the spec
  # cannot raise it, so a push fails with 403. Promote by updating
  # gitops/application-values.yaml and committing through the platform.
  # ---------------------------------------------------------------------
  - id: app-delivery
    stages:
      - id: app_test
        kind: test
        needs: []
        timeout_minutes: 25
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Run unit tests
            working-directory: app
            run: mvn -B -ntp test

      - id: app_release
        kind: build_push
        needs: [app_test]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_region: us-east-1
          TF_VAR_github_repo: ${{ github.repository }}
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Read the ECR repository URL from terraform state
            id: tf
            working-directory: infra
            run: |
              set -euo pipefail
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          - name: Package application
            working-directory: app
            run: mvn -B -ntp clean package -DskipTests
          - name: Derive image tag
            id: meta
            run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          - name: Build image
            working-directory: app
            run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
          - name: Scan image with Trivy
            uses: aquasecurity/trivy-action@master
            with:
              image-ref: local/app:${{ steps.meta.outputs.image_tag }}
              format: table
              exit-code: "1"
              severity: HIGH,CRITICAL
              ignore-unfixed: "true"
              trivyignores: app/.trivyignore
          - name: Confirm the AWS identity in use
            run: |
              set -euo pipefail
              aws sts get-caller-identity
          - name: Log in to ECR
            id: ecr
            uses: aws-actions/amazon-ecr-login@v2
          - name: Push image to ECR
            env:
              ECR_URL: ${{ steps.tf.outputs.ecr_url }}
            run: |
              set -euo pipefail
              TAG="${{ steps.meta.outputs.image_tag }}"
              docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"
              docker push "${ECR_URL}:${TAG}"
          - name: Print the image reference to promote
            env:
              ECR_URL: ${{ steps.tf.outputs.ecr_url }}
            run: |
              set -euo pipefail
              TAG="${{ steps.meta.outputs.image_tag }}"
              {
                echo "### Image published — promote it to deploy"
                echo ""
                echo "Set this in gitops/application-values.yaml and commit:"
                echo ""
                echo '```yaml'
                echo "image:"
                echo "  repository: ${ECR_URL}"
                echo "  tag: ${TAG}"
                echo '```'
                echo ""
                echo "ArgoCD reconciles the commit onto the cluster."
              } >> "$GITHUB_STEP_SUMMARY"

rollback:
  strategy: rerun
