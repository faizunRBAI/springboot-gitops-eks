# Values for the argo-cd Helm chart (installed by the configure stage).

configs:
  params:
    # Single-cluster install: TLS is terminated at the ALB (or absent), so the
    # API server runs insecure INSIDE the cluster. Without this, argocd-server
    # serves HTTPS on 8080 and redirects HTTP->HTTPS; a plain-HTTP ALB in front
    # of that produces an infinite redirect loop and the UI never loads.
    server.insecure: true

  cm:
    # Resource exclusions cut reconciliation noise.
    resource.exclusions: |
      - apiGroups:
          - "metrics.k8s.io"
        kinds:
          - "PodMetrics"
        clusters:
          - "*"

    # Teach ArgoCD how to judge Rollout health. Without this, ArgoCD reports a
    # paused canary as Progressing forever and the verify stage times out on a
    # rollout that is actually working as designed.
    resource.customizations.health.argoproj.io_Rollout: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase ~= nil then
          if obj.status.phase == "Healthy" then
            hs.status = "Healthy"
            hs.message = "Rollout is healthy"
            return hs
          elseif obj.status.phase == "Paused" then
            hs.status = "Suspended"
            hs.message = "Rollout is paused for analysis or manual promotion"
            return hs
          elseif obj.status.phase == "Degraded" then
            hs.status = "Degraded"
            hs.message = "Rollout is degraded"
            return hs
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Rollout is progressing"
      return hs

server:
  # ---------------------------------------------------------------------
  # INTERNET-EXPOSED — DELIBERATE, EXPLICITLY REQUESTED, TEST/DEMO ONLY.
  #
  # THIS IS NOT A DASHBOARD. ArgoCD is the cluster's CONTROL PLANE. The admin
  # account can sync, delete, and mutate every resource ArgoCD manages, which
  # here is the entire application. Whoever holds this password effectively
  # holds the cluster.
  #
  # WHAT IS NOW TRUE:
  #   * the login page is reachable from 0.0.0.0/0 and ALB hostnames are
  #     continuously scanned; an exposed ArgoCD login is a known target
  #   * there is NO TLS, so the admin password crosses the internet in
  #     CLEARTEXT on every login and is readable by anyone on the path
  #   * there is no SSO, no MFA, and no source-IP restriction; the password
  #     is the only control
  #
  # The user asked for full public access for a demo, having been shown these
  # consequences. This environment holds no real data.
  #
  # BEFORE THIS IS EVER PRODUCTION (all three, not one):
  #   1. TLS via cert-manager + ACM/Route53, redirect 80 -> 443
  #   2. SSO (dex/OIDC) or alb.ingress.kubernetes.io/inbound-cidrs limiting
  #      the ALB to known source addresses
  #   3. rotate ARGOCD_ADMIN_PASSWORD, since it has travelled unencrypted
  # ---------------------------------------------------------------------
  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: alb

    # hostname MUST be explicitly empty.
    #
    # Unlike the grafana chart (which simply omits the host when none is set),
    # argo-cd DEFAULTS server.ingress.hostname to "argocd.example.com". Leaving
    # it unset renders a rule bound to that placeholder host, so the ALB only
    # matches requests carrying that Host header and every request to the raw
    # ALB DNS name falls through to the default action and returns 404.
    #
    # The install still succeeds and the pipeline still goes green — the
    # failure is only visible from an actual HTTP request. Setting "" produces
    # a hostless rule that matches any Host, which is what makes the raw ALB
    # hostname usable without a domain.
    #
    # Put the real hostname here once DNS and TLS exist.
    hostname: ""

    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      # argocd-server exposes no /healthz on the HTTP route; / returns the UI.
      # A wrong path here marks every target unhealthy and the ALB serves 503.
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/success-codes: "200"
      # A dedicated ALB. Sharing the monitoring or application group would
      # couple an admin console's exposure to unrelated services.
      alb.ingress.kubernetes.io/group.name: argocd
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  # No external identity provider wired yet; disabled to save resources.
  # Enabling dex + OIDC is the correct fix for the public exposure above.
  enabled: false
