# Values for the argo-cd Helm chart (installed by the configure stage).

configs:
  params:
    # Single-cluster install: TLS is terminated at the ALB (or absent), so the
    # API server runs insecure INSIDE the cluster. Without this, argocd-server
    # serves HTTPS on 8080 and redirects HTTP->HTTPS; a plain-HTTP ALB in front
    # of that produces an infinite redirect loop and the UI never loads.
    server.insecure: true

  cm:
    # Resource exclusions cut reconciliation noise.
    resource.exclusions: |
      - apiGroups:
          - "metrics.k8s.io"
        kinds:
          - "PodMetrics"
        clusters:
          - "*"

    # Teach ArgoCD how to judge Rollout health. Without this, ArgoCD reports a
    # paused canary as Progressing forever and the verify stage times out on a
    # rollout that is actually working as designed.
    resource.customizations.health.argoproj.io_Rollout: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase ~= nil then
          if obj.status.phase == "Healthy" then
            hs.status = "Healthy"
            hs.message = "Rollout is healthy"
            return hs
          elseif obj.status.phase == "Paused" then
            hs.status = "Suspended"
            hs.message = "Rollout is paused for analysis or manual promotion"
            return hs
          elseif obj.status.phase == "Degraded" then
            hs.status = "Degraded"
            hs.message = "Rollout is degraded"
            return hs
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Rollout is progressing"
      return hs

server:
  # ---------------------------------------------------------------------
  # THE CONSOLE IS INTERNET-EXPOSED, but NOT through this chart.
  #
  # server.ingress stays DISABLED. The chart defaults its ingress hostname to
  # the placeholder "argocd.example.com" and does not honour an empty string,
  # so its rendered rule is always host-scoped and the raw ALB DNS name
  # returns 404. Verified against the live release: setting hostname: ""
  # changed nothing, while annotation changes in the same commit applied
  # normally — so the values file was being read; the chart simply overrides
  # an empty hostname with its default.
  #
  # The public ingress is therefore a manifest this repository owns:
  #   gitops/argocd-ingress.yaml   (applied by the configure stage)
  # It omits the host key entirely, which matches any hostname.
  #
  # DO NOT re-enable this and delete that file without checking the rendered
  # rule: helm reports success either way and the failure is visible only from
  # an actual HTTP request.
  # ---------------------------------------------------------------------
  service:
    type: ClusterIP

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  # No external identity provider wired yet; disabled to save resources.
  # Enabling dex + OIDC is the correct fix for the public exposure above.
  enabled: false
