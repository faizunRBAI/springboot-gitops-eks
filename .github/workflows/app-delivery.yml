name: app-delivery
'on':
  workflow_dispatch: {}
jobs:
  app_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Run unit tests
      run: mvn -B -ntp test
      working-directory: app
  app_release:
    runs-on: ubuntu-latest
    needs:
    - app_test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - id: tf
      name: Read the ECR repository URL from terraform state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"ecr_url=$(terraform output -raw ecr_repository_url)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Package application
      run: mvn -B -ntp clean package -DskipTests
      working-directory: app
    - id: meta
      name: Derive image tag
      run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
    - name: Build image
      run: docker build -t local/app:${{ steps.meta.outputs.image_tag }} .
      working-directory: app
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: local/app:${{ steps.meta.outputs.image_tag }}
        format: table
        exit-code: '1'
        severity: HIGH,CRITICAL
        ignore-unfixed: 'true'
    - name: Authenticate to AWS via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
        aws-region: us-east-1
    - id: ecr
      name: Log in to ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Push image to ECR
      run: 'set -euo pipefail

        TAG="${{ steps.meta.outputs.image_tag }}"

        docker tag "local/app:${TAG}" "${ECR_URL}:${TAG}"

        docker push "${ECR_URL}:${TAG}"

        '
      env:
        ECR_URL: ${{ steps.tf.outputs.ecr_url }}
    - name: Bump the image tag in the GitOps values
      run: "set -euo pipefail\nTAG=\"${{ steps.meta.outputs.image_tag }}\"\npython3\
        \ - \"$TAG\" <<'PY'\nimport sys, pathlib, re\ntag = sys.argv[1]\np = pathlib.Path(\"\
        gitops/application-values.yaml\")\ntext = p.read_text()\nnew, n = re.subn(r'(?m)^(\\\
        s*tag:\\s*).*$', lambda m: m.group(1) + tag, text, count=1)\nif n != 1:\n\
        \    raise SystemExit(\"expected exactly one 'tag:' line in gitops/application-values.yaml\"\
        )\np.write_text(new)\nprint(f\"pinned image tag {tag}\")\nPY\n"
    - name: Commit and push the tag bump
      run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit config\
        \ user.email \"github-actions[bot]@users.noreply.github.com\"\nif git diff\
        \ --quiet -- gitops/application-values.yaml; then\n  echo \"Image tag unchanged;\
        \ nothing to commit.\"\nelse\n  git add gitops/application-values.yaml\n \
        \ # [skip ci] stops this commit from starting another run.\n  git commit -m\
        \ \"chore(gitops): deploy ${{ steps.meta.outputs.image_tag }} [skip ci]\"\n\
        \  git push origin HEAD:main\n  echo \"ArgoCD will reconcile this commit onto\
        \ the cluster.\"\nfi\n"
