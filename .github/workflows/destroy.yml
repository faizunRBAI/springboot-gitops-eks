name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Terraform init
        working-directory: infra
        run: "set -euo pipefail\nregion=\"${AWS_REGION:-}\"\ncompat=\"\"\nif [ -n \"${AWS_ENDPOINT_URL_S3:-}\" ]; then\n  host=\"${AWS_ENDPOINT_URL_S3#https://}\"\n  region=\"${host%%.*}\"\n  compat=\"-backend-config=skip_credentials_validation=true -backend-config=skip_requesting_account_id=true -backend-config=skip_metadata_api_check=true -backend-config=skip_region_validation=true -backend-config=skip_s3_checksum=true -backend-config=use_path_style=true\"\nfi\nterraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME }}/terraform.tfstate\" \\\n  -backend-config=\"region=${region}\" $compat"
    # ------------------------------------------------------------------
    # DRAIN THE CONTROLLER-MANAGED LOAD BALANCERS *BEFORE* TERRAFORM RUNS.
    #
    # The three internet-facing ALBs in this stack (argocd, monitoring and the
    # application ingress) are created by the AWS Load Balancer Controller
    # running INSIDE the cluster. Terraform does not know about them, their
    # ENIs, or the security groups the controller creates for them.
    #
    # A bare `terraform destroy` deletes the node group and control plane
    # first, which kills the only component capable of deleting those ALBs.
    # The orphaned ALB ENIs then hold the public subnets and the internet
    # gateway open forever, and the destroy hangs on
    #   aws_subnet.public[*]: Still destroying... [19m00s elapsed]
    #   aws_internet_gateway.main: Still destroying... [19m00s elapsed]
    # until the job is cancelled.
    #
    # Deleting the Ingress/Service objects while the controller is still
    # alive makes it tear its own ALBs down cleanly, releasing the ENIs.
    # Every step here is best-effort: a partially-destroyed or already-gone
    # cluster must not block the terraform destroy that follows.
    # ------------------------------------------------------------------
      - name: Delete controller-managed load balancers
        timeout-minutes: 20
        working-directory: infra
        run: "set -uo pipefail\nCLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo \"\")\nVPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo \"\")\nif [ -z \"${CLUSTER}\" ]; then\n  echo \"No cluster in state; nothing to drain.\"\n  exit 0\nfi\nif ! aws eks describe-cluster --name \"${CLUSTER}\" --region \"${AWS_REGION}\" >/dev/null 2>&1; then\n  echo \"Cluster ${CLUSTER} no longer exists; nothing to drain.\"\n  exit 0\nfi\naws eks update-kubeconfig --name \"${CLUSTER}\" --region \"${AWS_REGION}\" || exit 0\n\n# Ingresses own the ALBs; LoadBalancer Services own any NLBs.\necho \"--- deleting Ingress objects ---\"\nkubectl delete ingress --all --all-namespaces --ignore-not-found=true --timeout=5m || true\necho \"--- deleting LoadBalancer Services ---\"\nkubectl get svc --all-namespaces \\\n  -o jsonpath='{range .items[?(@.spec.type==\"LoadBalancer\")]}{.metadata.namespace}{\" \"}{.metadata.name}{\"\\n\"}{end}' 2>/dev/null \\\n  | while read -r ns name; do\n      [ -n \"${ns:-}\" ] || continue\n      echo \"deleting svc ${ns}/${name}\"\n      kubectl -n \"${ns}\" delete svc \"${name}\" --ignore-not-found=true --timeout=5m || true\n    done\n\n# The controller deletes the ALB asynchronously after the object goes away.\n# Terraform must not start until AWS reports the ENIs released.\nif [ -n \"${VPC_ID}\" ]; then\n  echo \"--- waiting for load balancers in ${VPC_ID} to disappear ---\"\n  for i in $(seq 1 60); do\n    COUNT=$(aws elbv2 describe-load-balancers --region \"${AWS_REGION}\" \\\n      --query \"length(LoadBalancers[?VpcId=='${VPC_ID}'])\" --output text 2>/dev/null || echo 0)\n    CLASSIC=$(aws elb describe-load-balancers --region \"${AWS_REGION}\" \\\n      --query \"length(LoadBalancerDescriptions[?VPCId=='${VPC_ID}'])\" --output text 2>/dev/null || echo 0)\n    if [ \"${COUNT}\" = \"0\" ] && [ \"${CLASSIC}\" = \"0\" ]; then\n      echo \"All load balancers in ${VPC_ID} are gone.\"\n      break\n    fi\n    echo \"attempt ${i}: ${COUNT} ALB/NLB + ${CLASSIC} classic still present; waiting\"\n    sleep 10\n  done\nfi\nexit 0"
    # ------------------------------------------------------------------
    # Safety net for a VPC left dirty by a PREVIOUS cancelled destroy, where
    # the cluster (and therefore the controller) is already gone and the
    # drain above could not run. Releases only leftover load-balancer ENIs
    # and the controller's own security groups inside this VPC.
    # ------------------------------------------------------------------
      - name: Sweep orphaned load balancer ENIs and security groups
        timeout-minutes: 15
        working-directory: infra
        run: "set -uo pipefail\nVPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo \"\")\nif [ -z \"${VPC_ID}\" ]; then\n  echo \"No VPC in state; nothing to sweep.\"\n  exit 0\nfi\n\necho \"--- detaching/deleting orphaned ELB network interfaces in ${VPC_ID} ---\"\naws ec2 describe-network-interfaces --region \"${AWS_REGION}\" \\\n  --filters \"Name=vpc-id,Values=${VPC_ID}\" \"Name=description,Values=ELB*\" \\\n  --query 'NetworkInterfaces[].[NetworkInterfaceId,Attachment.AttachmentId,Status]' \\\n  --output text 2>/dev/null \\\n  | while read -r eni attach status; do\n      [ -n \"${eni:-}\" ] || continue\n      echo \"orphan ENI ${eni} (${status})\"\n      if [ -n \"${attach:-}\" ] && [ \"${attach}\" != \"None\" ]; then\n        aws ec2 detach-network-interface --region \"${AWS_REGION}\" \\\n          --attachment-id \"${attach}\" --force || true\n        sleep 10\n      fi\n      aws ec2 delete-network-interface --region \"${AWS_REGION}\" \\\n        --network-interface-id \"${eni}\" || true\n    done\n\n# Controller-created SGs are tagged with the cluster they belong to. They are not in\n# terraform state, so terraform never removes them and the VPC cannot go.\necho \"--- deleting controller-managed security groups in ${VPC_ID} ---\"\nfor attempt in 1 2 3; do\n  REMAINING=0\n  for sg in $(aws ec2 describe-security-groups --region \"${AWS_REGION}\" \\\n    --filters \"Name=vpc-id,Values=${VPC_ID}\" \\\n              \"Name=tag-key,Values=elbv2.k8s.aws/cluster\" \\\n    --query 'SecurityGroups[].GroupId' --output text 2>/dev/null); do\n    echo \"deleting security group ${sg} (attempt ${attempt})\"\n    aws ec2 delete-security-group --region \"${AWS_REGION}\" --group-id \"${sg}\" || REMAINING=1\n  done\n  [ \"${REMAINING}\" = \"0\" ] && break\n  sleep 15\ndone\nexit 0"
      - name: Terraform destroy
        working-directory: infra
        run: "set -euo pipefail\nterraform destroy -input=false -auto-approve"
