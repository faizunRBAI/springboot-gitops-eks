spring.application.name=springboot-gitops-eks
server.port=8080

# Graceful shutdown: let in-flight requests finish when Argo Rollouts scales
# down an old ReplicaSet. Must stay <= the pod's terminationGracePeriodSeconds.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Expose only what is needed: health/readiness for kubelet probes,
# prometheus for scraping, info for the landing page.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Tag every metric with the application name so Grafana and the Argo Rollouts
# AnalysisTemplate can select this service's series unambiguously.
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# Percentile histogram for http.server.requests: required for latency-based
# canary analysis (histogram_quantile over the _bucket series).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Injected by the Helm chart from the pod spec.
app.version=@project.version@
app.image-tag=${APP_IMAGE_TAG:local}
app.pod-name=${POD_NAME:local}
